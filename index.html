<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lacak Sarana</title>
<style>
  :root { --tw: 64px; --green: #0a9a7b; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; max-width: 480px; margin: auto; }
  .head { font-size: 14px; color: #666; margin-bottom: 16px; }
  .head b { color: #222; }

  .item { display: flex; gap: 12px; position: relative; padding-bottom: 24px; transition: color .2s; }
  .time { width: var(--tw); text-align: right; font-size: 13px; flex-shrink: 0; line-height: 1.3; }
  .item::before { content: ""; position: absolute; left: calc(var(--tw) + 16.5px);
                  top: 6px; bottom: -6px; width: 1px; background: #ddd; }
  .item:last-child::before { display: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; z-index: 1;
         flex-shrink: 0; box-sizing: border-box; transition: background .2s, transform .2s; }
  .text { flex: 1; font-size: 16px; }

  .item.done { color: #666; }
  .item.done .dot { background: #9bd4c7; }
  .item.active { color: var(--green); font-weight: 600; }
  .item.active .time { color: #222; font-weight: 400; }
  .item.active .dot { background: var(--green); }
  .item.pending { color: #bbb; }
  .item.pending .dot { background: #fff; border: 2px solid #ccc; }

  .item:hover { color: var(--green); }
  .item:hover .dot { background: var(--green); border-color: var(--green); transform: scale(1.3); }
</style>
</head>
<body>
  <div class="card" id="box">Memuat...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw1g0LVOiWw3pGq2fkon3YXgFmdTOmLapEGw1YRigqg_50VkjWdRwKC9Bum_n4bT9sNxg/exec";
const NEWEST_FIRST = true;

const ORDER = (new URLSearchParams(location.search).get("order") || "")
  .replace(/[^A-Za-z0-9_-]/g, "");

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render(data) {
  const box = document.getElementById("box");
  if (!data) {
    box.textContent = ORDER
      ? "No Sarana " + ORDER + " tidak ditemukan."
      : "Tambahkan ?order=NO_SARANA di akhir URL.";
    return;
  }

  let items = data.steps.map((s, i) => ({ ...s, i }));
  if (NEWEST_FIRST) items.reverse();

  box.innerHTML =
    `<div class="head">No Sarana: <b>${esc(data.order)}</b></div>` +
    items.map(s => {
      const cls = s.i === data.active ? "active" : (s.date ? "done" : "pending");
      const date = s.date ? esc(s.date).replace(/ (\d{4})$/, "<br>$1") : "—";
      return `
        <div class="item ${cls}">
          <div class="time">${date}</div>
          <div class="dot"></div>
          <div class="text">${esc(s.label)}</div>
        </div>`;
    }).join("");
}

if (!ORDER) {
  render(null);
} else {
  fetch(`${API_URL}?format=json&order=${encodeURIComponent(ORDER)}`)
    .then(r => r.json())
    .then(render)
    .catch(err => {
      document.getElementById("box").textContent = "Gagal memuat data: " + err.message;
      console.error(err);
      });
}
</script>
</body>
</html>
